</head>

  <body>
    <div id="root">
      <div id="app-splash" style="
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #ffffff;
        gap: 24px;
        z-index: 99999;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      ">
        <img src="/newlogo.png" alt="BookinGO" style="width: 175px; height: auto; animation: splashPulse 1.6s ease-in-out infinite;" />
        <div style="width: 140px; height: 3.5px; background: #e2e8f0; border-radius: 999px; overflow: hidden; position: relative;">
          <div style="width: 45px; height: 100%; background: #0865FE; border-radius: 999px; position: absolute; animation: splashProgress 1.3s infinite ease-in-out;"></div>
        </div>
        <style>
          @keyframes splashPulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(0.97); opacity: 0.85; }
          }
          @keyframes splashProgress {
            0% { left: -35%; }
            50% { left: 100%; }
            100% { left: -35%; }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
